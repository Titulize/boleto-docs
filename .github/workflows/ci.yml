name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Validar versions.toml e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - name: Arquivos derivados em dia com o versions.toml
        run: npm run sync:check
      - run: npm test

  bootstrap-linux:
    name: Bootstrap (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck --shell=bash bootstrap/bootstrap.sh
      - name: Sintaxe do script PowerShell
        shell: pwsh
        run: |
          $errs = $null; $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/bootstrap/bootstrap.ps1", [ref]$tokens, [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Instalar em pasta isolada
        run: BOLETO_DEV_HOME="$RUNNER_TEMP/boleto-dev" bash bootstrap/bootstrap.sh install --editor none
      - name: Doctor
        run: BOLETO_DEV_HOME="$RUNNER_TEMP/boleto-dev" bash bootstrap/bootstrap.sh doctor --editor none
      # O runner é descartável: daqui em diante o install grava de verdade nos arquivos do shell.
      - name: Instalar no local padrão (persistente) e conferir em shell novo
        run: |
          bash bootstrap/bootstrap.sh install --editor none
          bash -lc 'bash bootstrap/bootstrap.sh doctor --editor none | tee /tmp/doctor-padrao.txt'
          grep -q "pasta de instalação: $HOME/.boleto-dev (padrão" /tmp/doctor-padrao.txt
          grep -q "OK .*JAVA_HOME=$HOME/.local/share/mise/" /tmp/doctor-padrao.txt
      - name: Instalar em pasta escolhida (persistente) e conferir em shell novo
        run: |
          bash bootstrap/bootstrap.sh install --install-dir "$RUNNER_TEMP/tools" --editor none
          bash -lc 'bash bootstrap/bootstrap.sh doctor --editor none | tee /tmp/doctor.txt'
          grep -q "pasta de instalação: $RUNNER_TEMP/tools (escolhida (BOLETO_INSTALL_DIR))" /tmp/doctor.txt
          grep -q "OK .*JAVA_HOME=$RUNNER_TEMP/tools/" /tmp/doctor.txt
          bash -lc 'java -version 2>&1 | grep -q "version \"25"'

  bootstrap-windows:
    name: Bootstrap (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BOLETO_IGNORE_DOCKER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar em pasta isolada
        shell: powershell
        run: |
          $env:BOLETO_DEV_HOME = Join-Path $env:RUNNER_TEMP 'boleto-dev'
          powershell -NoProfile -ExecutionPolicy Bypass -File bootstrap/bootstrap.ps1 install -Editor none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Doctor
        shell: powershell
        run: |
          $env:BOLETO_DEV_HOME = Join-Path $env:RUNNER_TEMP 'boleto-dev'
          powershell -NoProfile -ExecutionPolicy Bypass -File bootstrap/bootstrap.ps1 doctor -Editor none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testes da lógica de PATH (PowerShell 7 e 5.1)
        shell: powershell
        run: |
          pwsh -NoProfile -File bootstrap/tests/path.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File bootstrap/tests/path.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # O runner é descartável: daqui em diante o install grava de verdade no ambiente do usuário.
      - name: Instalar no local padrão (persistente)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File bootstrap/bootstrap.ps1 install -Editor none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Terminal novo usa o local padrão
        shell: powershell
        run: bootstrap/ci/check-user-env.ps1 -DefaultMode
      - name: Instalar em pasta escolhida (persistente)
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tools um'
          powershell -NoProfile -ExecutionPolicy Bypass -File bootstrap/bootstrap.ps1 install -InstallDir $dir -Editor none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Terminal novo usa a pasta escolhida e o PATH do padrão sumiu
        shell: powershell
        run: |
          $stale = @((Join-Path $env:LOCALAPPDATA 'boleto-dev'), (Join-Path $env:LOCALAPPDATA 'mise\shims'))
          bootstrap/ci/check-user-env.ps1 -ExpectedDir (Join-Path $env:RUNNER_TEMP 'tools um') -StaleDir $stale
      - name: Trocar de pasta limpa o PATH antigo
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tools dois'
          powershell -NoProfile -ExecutionPolicy Bypass -File bootstrap/bootstrap.ps1 install -InstallDir $dir -Editor none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bootstrap/ci/check-user-env.ps1 -ExpectedDir $dir -StaleDir (Join-Path $env:RUNNER_TEMP 'tools um')

  compose-linux:
    name: Compose de desenvolvimento (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configuração do compose (infraestrutura e profile docs)
        run: |
          docker compose config -q
          docker compose --profile docs config -q
      # O PostgreSQL (public.ecr.aws) falhou com "Data limit exceeded" no commit 6650ff5 e o Valkey
      # e o Mailpit (docker.io) têm limite de pulls anônimos (ADR 0006). As imagens ficam em cache.
      # A chave vem da lista de imagens do compose, com digest: trocar um digest no versions.toml
      # muda a chave e o cache antigo deixa de valer.
      - name: Lista de imagens do compose e chave do cache
        id: imagens
        run: |
          docker compose config --images | sort > "$RUNNER_TEMP/imagens.txt"
          echo "Imagens do compose:"; cat "$RUNNER_TEMP/imagens.txt"
          echo "chave=imagens-compose-v1-$RUNNER_OS-$RUNNER_ARCH-$(sha256sum "$RUNNER_TEMP/imagens.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restaurar o cache das imagens
        id: cache-imagens
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/imagens-compose.tar
          key: ${{ steps.imagens.outputs.chave }}
      - name: Carregar as imagens do cache ou baixar (até 3 tentativas)
        id: imagens-carregadas
        env:
          CACHE_HIT: ${{ steps.cache-imagens.outputs.cache-hit }}
          CHAVE: ${{ steps.imagens.outputs.chave }}
        run: |
          tar_imagens="$RUNNER_TEMP/imagens-compose.tar"
          faltando() {
            # Depois do docker load a imagem pode não ter o nome repo:tag@digest, mas o ID dela é o digest.
            while read -r img; do
              docker image inspect "$img" > /dev/null 2>&1 \
                || docker image inspect "sha256:${img##*@sha256:}" > /dev/null 2>&1 \
                || { echo "faltando no cache: $img"; return 0; }
            done < "$RUNNER_TEMP/imagens.txt"
            return 1
          }
          if [ "$CACHE_HIT" = "true" ]; then
            echo "CACHE HIT ($CHAVE): carregando as imagens do cache, sem pull"
            docker load -i "$tar_imagens"
            if ! faltando; then
              echo "Imagens carregadas do cache. Nenhum pull foi feito."
              echo "salvar=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::O cache não tinha todas as imagens. Baixando."
          else
            echo "CACHE MISS ($CHAVE): baixando as imagens e salvando no cache"
          fi
          for i in 1 2 3; do
            if docker compose pull; then
              # shellcheck disable=SC2046
              docker save -o "$tar_imagens" $(cat "$RUNNER_TEMP/imagens.txt")
              ls -lh "$tar_imagens"
              echo "salvar=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "tentativa $i falhou"; sleep $((30 * i))
          done
          exit 1
      - name: Salvar o cache das imagens
        if: steps.imagens-carregadas.outputs.salvar == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/imagens-compose.tar
          key: ${{ steps.imagens.outputs.chave }}
      # A partir daqui só comandos padrão do Docker Compose, os mesmos do guia.
      - name: docker compose up -d --wait (sobe só a infraestrutura)
        run: |
          docker compose up -d --wait
          docker compose ps
          test "$(docker compose ps --services | sort | tr '\n' ' ')" = "mailpit postgres valkey "
      - name: Sondagens dos serviços
        run: |
          test "$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select 1"' | tr -d '[:space:]')" = "1"
          test "$(docker compose exec -T valkey sh -c 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping' | tr -d '[:space:]')" = "PONG"
          docker compose exec -T valkey valkey-cli ping | grep -q NOAUTH
          curl -fsS -o /dev/null http://localhost:8025/
          curl -fsS -o /dev/null http://localhost:8025/api/v1/info
          # Toda porta publicada fica em 127.0.0.1.
          if docker compose ps --format '{{.Ports}}' | tr ',' '\n' | grep -- '->' | grep -v -- '127\.0\.0\.1:'; then
            echo "porta publicada fora de 127.0.0.1"; exit 1
          fi
      - name: down mantém os dados e down -v apaga
        run: |
          docker compose exec -T postgres psql -U postgres -d boleto -c 'create table ci_reset(id int)'
          docker compose down
          test -z "$(docker compose ps -q)"
          docker compose up -d --wait
          test "$(docker compose exec -T postgres psql -U postgres -d boleto -tAc "select to_regclass('ci_reset')" | tr -d '[:space:]')" = "ci_reset"
          docker compose down -v
          docker compose up -d --wait
          left="$(docker compose exec -T postgres psql -U postgres -d boleto -tAc "select to_regclass('ci_reset')" | tr -d '[:space:]')"
          test -z "$left" || { echo "a tabela continuou depois do down -v: $left"; exit 1; }
      - name: Diagnóstico e limpeza
        if: always()
        run: |
          docker compose ps -a || true
          if [ "${{ job.status }}" != "success" ]; then docker compose logs --tail 50 || true; fi
          docker compose --profile docs down --volumes --remove-orphans || true
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validar mensagens dos commits do PR
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
