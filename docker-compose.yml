# Compose do boleto-docs, na raiz do repositório. Só use os comandos padrão do Docker Compose:
#
#   docker compose up -d           sobe PostgreSQL, Valkey, Mailpit, a migração (flyway) e o backend
#                                  (constrói as imagens no primeiro uso; precisa de ../boleto-backend
#                                  e ../boleto-migrations ao lado deste repositório)
#   docker compose up -d --build   reconstrói as imagens depois de mudar o backend ou as migrações
#   docker compose down            derruba tudo e mantém os dados
#   docker compose down -v         derruba tudo e apaga os dados
#   docker compose ps
#   docker compose logs -f backend
#   docker compose up -d --wait postgres valkey mailpit   só a infraestrutura, esperando ficar saudável
#       (é o que a CI do boleto-docs faz: ela não tem acesso aos repositórios privados)
#   docker compose run --build --rm flyway   só a migração (sobe o postgres se preciso; sai com
#       código diferente de zero se uma migração falhar)
#   docker compose --profile docs up -d --wait docs   sobe também o site de documentação
#
# Sem ../boleto-backend ou ../boleto-migrations, o build falha com `unable to prepare context: path
# "..." not found`. Em worktree do git esse caminho não resolve: aponte BACKEND_CONTEXT e
# MIGRATIONS_CONTEXT para os diretórios dos repositórios (modelo em .env.example).
#
# As imagens (tag e digest) ficam no bloco gerado abaixo, escrito pela sincronização a partir
# do versions.toml (npm run sync). Nunca edite o bloco: a CI falha se ele divergir.
# As credenciais e as portas têm valor padrão de desenvolvimento neste arquivo. Para trocar,
# crie um .env na raiz (modelo em .env.example). O .env não vai para o git.
#
# O schema e as roles do banco são do boleto-migrations, aplicados pelo serviço flyway (execução
# única, ADR 0027). O backend espera o banco saudável e a migração concluída (ADR 0034). Os dois
# sobem no `up` padrão (ADR 0035, que substitui em parte os ADRs 0022 e 0034). Só o site fica em
# profile (docs).
# O Task 11 acrescenta o serviço otel-lgtm com `profiles: [observability]`.
name: boleto-dev

# >>> platform-versions
# Gerado por sync-versions.mjs a partir de versions.toml (local). Não edite este bloco.
x-images:
  postgres: &postgres-image public.ecr.aws/docker/library/postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
  valkey: &valkey-image docker.io/valkey/valkey:9.1.4@sha256:3ab0eca823ebbf0fe352476ebac330ac9e5f14b592b9a954eab296d341e81b0e
  mailpit: &mailpit-image docker.io/axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
# <<< platform-versions

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      POSTGRES_DB: ${POSTGRES_DB:-boleto}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # No PostgreSQL 18 o PGDATA fica em /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  valkey:
    image: *valkey-image
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-valkey_dev}
    command: ['valkey-server', '--appendonly', 'yes', '--requirepass', '${VALKEY_PASSWORD:-valkey_dev}']
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  mailpit:
    image: *mailpit-image
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      # A imagem não tem shell nem curl. O próprio binário tem o subcomando readyz.
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  # Migrações do banco (boleto-migrations): executa uma vez e sai (código 0) a cada `up`; o backend
  # espera por ela. Para rodar só a migração use `docker compose run --build --rm flyway`. Não use
  # `up --exit-code-from flyway`: implica --abort-on-container-exit e para o postgres no fim.
  # Em produção a mesma imagem é o primeiro passo do deploy (ADR 0027).
  flyway:
    build:
      context: ${MIGRATIONS_CONTEXT:-../boleto-migrations}
    image: boleto-migrations:dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-boleto}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      # Senha da role boleto_app (a que o backend usa), aplicada a cada execução pelo afterMigrate.
      FLYWAY_PLACEHOLDERS_APP_PASSWORD: ${BOLETO_APP_PASSWORD:-boleto_app_dev}
  # API Spring Boot (boleto-backend). Espera o banco saudável e a migração concluída com sucesso
  # (ADR 0027) e o valkey saudável (sessões e limites, ADRs 0046 e 0047). A documentação da API (Swagger UI) fica
  # ligada só aqui, no dev (ADR 0032). O contexto de build é ../boleto-backend; em worktree use
  # BACKEND_CONTEXT.
  backend:
    build:
      context: ${BACKEND_CONTEXT:-../boleto-backend}
    image: boleto-backend:dev
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: 'no'
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-boleto}
      SPRING_DATASOURCE_USERNAME: boleto_app
      SPRING_DATASOURCE_PASSWORD: ${BOLETO_APP_PASSWORD:-boleto_app_dev}
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${VALKEY_PASSWORD:-valkey_dev}
      # Só no dev: chave JWT efêmera, os tokens morrem quando o backend reinicia (ADR 0044).
      BOLETO_JWT_GERAR_CHAVE_EFEMERA: 'true'
      # Administrador inicial, só para desenvolvimento (ADR 0049).
      BOLETO_ADMIN_INICIAL_EMAIL: ${BOLETO_ADMIN_INICIAL_EMAIL:-admin@boleto.test}
      BOLETO_ADMIN_INICIAL_SENHA: ${BOLETO_ADMIN_INICIAL_SENHA:-Admin-dev-2026!}
      # E-mail de convite e de recuperação de senha: o Mailpit captura tudo (ADR 0053).
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      BOLETO_APP_URL_BASE: ${BOLETO_APP_URL_BASE:-http://localhost:4200}
      BOLETO_EMAIL_REMETENTE: ${BOLETO_EMAIL_REMETENTE:-Plataforma de Boletos <nao-responda@boleto.test>}
      # CPF cifrado (ADR 0054). Estas duas chaves são CONSTANTES DE DESENVOLVIMENTO, públicas e sem valor:
      # os bytes são o texto legível "DEV-ONLY-...". Não são segredos. Em produção as chaves vêm do cofre.
      # A chave efêmera (BOLETO_PII_GERAR_CHAVES_EFEMERAS) não serve aqui: o volume do banco sobrevive ao
      # restart e o CPF gravado ficaria ilegível.
      BOLETO_PII_CPF_CHAVES_1: ${BOLETO_PII_CPF_CHAVES_1:-REVWLU9OTFktY2hhdmUtY3BmLW5hby1lLXNlZ3JlZG8=}
      BOLETO_PII_CPF_VERSAO_ATUAL: '1'
      BOLETO_PII_CPF_INDICE_CHAVE: ${BOLETO_PII_CPF_INDICE_CHAVE:-REVWLU9OTFktaW5kaWNlLWNwZi1zZW0tc2VncmVkbyE=}
      SPRINGDOC_API_DOCS_ENABLED: 'true'
      SPRINGDOC_SWAGGER_UI_ENABLED: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Site de documentação (Docusaurus). Só sobe com o profile docs (--profile docs), para que o
  # `docker compose up -d` padrão não construa o site.
  docs:
    profiles: [docs]
    build:
      context: .
      dockerfile: docker/docs.Dockerfile
    ports:
      - '127.0.0.1:${DOCS_PORT:-3000}:3000'
    volumes:
      - ./site:/app
      - docs_node_modules:/app/node_modules
    environment:
      # Necessário para recarregar ao salvar com bind mount no Windows e no macOS.
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/boleto-docs/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  postgres_data:
  valkey_data:
  docs_node_modules:
