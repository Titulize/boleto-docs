# Compose do repositório boleto-docs.
# Hoje só tem o site de documentação. O Task 5 acrescenta a infraestrutura de desenvolvimento.
name: boleto-docs

services:
  docs:
    build:
      context: .
      dockerfile: docker/docs.Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./site:/app
      - docs_node_modules:/app/node_modules
    environment:
      # Necessário para recarregar ao salvar com bind mount no Windows e no macOS.
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/boleto-docs/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  docs_node_modules:
