# Fonte única de verdade das versões da plataforma de boletos.
#
# Regras (validadas por scripts/validate-versions.mjs):
#  - Toda versão é exata. Sem faixas (^, ~, >, *), sem "latest", sem "+".
#  - Toda imagem Docker tem tag e digest sha256.
#  - Todo download tem URL e sha256.
#  - Os outros repositórios fixam uma TAG deste repositório (vX.Y.Z), nunca a main.
#
# Formato próprio (não é um catálogo do Gradle). Os arquivos derivados
# (libs.versions.toml, build args do Docker, pins do frontend) são gerados pela sincronização.
#
# Pesquisado em 2026-11-20. Fontes: endoflife.date, Maven Central, npm, registries de imagem.

schema_version = 1

[runtime.java]
# Amazon Corretto 25 (LTS, suporte até 2032-10). Imagens Docker em [images.corretto_*].
major = "25"
version = "25.0.5"

[runtime.node]
# Node 26 é LTS ativa desde 2026-10-28. Angular 22 aceita ^26.0.0.
version = "26.13.1"
url_linux_x64 = "https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz"
sha256_linux_x64 = "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864"
url_linux_arm64 = "https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-arm64.tar.xz"
sha256_linux_arm64 = "89e1853138db51e8b82d3e98ba9c0d3f2956a28e5e55ea1b7e12d25aae92d5dd"

[tools.gradle]
version = "9.9.2"
distribution_url = "https://services.gradle.org/distributions/gradle-9.9.2-bin.zip"
distribution_sha256 = "971fcd7150ca4ba04852c0b2ca0d2d0ab9468e14b03473eab19528809914c76b"

[tools.flyway]
# Só existe build linux-x64 (sem linux-arm64). Em Apple Silicon roda via emulação.
version = "13.13.0"
url_linux_x64 = "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/13.13.0/flyway-commandline-13.13.0-linux-x64.tar.gz"
sha256_linux_x64 = "0695a34868114c25e44bc4159d461c2173f8bfe383ce987bb9301a8562f7c056"

# ---------------------------------------------------------------------------
# Imagens Docker (digest do índice multi-arquitetura)
# Imagens oficiais são puxadas pelo espelho público da AWS (public.ecr.aws) para
# evitar o limite de pulls do Docker Hub. Em produção, PostgreSQL e Redis serão gerenciados.
# ---------------------------------------------------------------------------

[images.amazonlinux]
ref = "public.ecr.aws/amazonlinux/amazonlinux"
tag = "2023.12.20261117.0"
digest = "sha256:3f018977be7a3473a0a473ed105b244b8bdec8683ecb24962f675db23017137b"

[images.corretto_jdk]
ref = "public.ecr.aws/amazoncorretto/amazoncorretto"
tag = "25.0.5-al2023"
digest = "sha256:ebfff57b28821f29ed5fae168b2e77dbcbee8c65d3cf56a9d91a02ae0d917922"

[images.corretto_headless]
ref = "public.ecr.aws/amazoncorretto/amazoncorretto"
tag = "25.0.5-al2023-headless"
digest = "sha256:82233ddb5aad03477f9cb23f5f4fabcfde00f37584a902cf5c17ef0f14b62e77"

[images.postgres]
ref = "public.ecr.aws/docker/library/postgres"
tag = "18.7"
digest = "sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a"

[images.valkey]
# Valkey substitui o Redis: é compatível com o protocolo e com o Lettuce, e o Amazon ElastiCache
# oferece Valkey (9.1 disponível desde 2026-06), com preço menor que o Redis OSS.
ref = "docker.io/valkey/valkey"
tag = "9.1.4"
digest = "sha256:3ab0eca823ebbf0fe352476ebac330ac9e5f14b592b9a954eab296d341e81b0e"

[images.mailpit]
ref = "docker.io/axllent/mailpit"
tag = "v1.34.0"
digest = "sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e"

[images.otel_lgtm]
ref = "docker.io/grafana/otel-lgtm"
tag = "0.41.1"
digest = "sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5"

# ---------------------------------------------------------------------------
# Backend. Bibliotecas gerenciadas pelo BOM do Spring Boot (Hibernate 7.4.15,
# Spring Security 7.1.3, Testcontainers 2.0.5, Lettuce 7.5.2, driver PostgreSQL 42.7.14)
# não são repetidas aqui: seguem a versão do Spring Boot.
# ---------------------------------------------------------------------------

[backend.plugins]
spring_boot = { id = "org.springframework.boot", version = "4.1.3" }
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }

[backend.libs]
spring_modulith_bom = { module = "org.springframework.modulith:spring-modulith-bom", version = "2.1.3" }
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "3.2.0" }
bucket4j_core = { module = "com.bucket4j:bucket4j_jdk17-core", version = "8.22.0" }
bucket4j_lettuce = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version = "8.22.0" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version = "1.5.1" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.87" }

[backend.tools]
jacoco = { version = "0.8.16" }

# ---------------------------------------------------------------------------
# Frontend. Angular 22 exige TypeScript >=6.0 <6.1 e Node ^22.22.3 || ^24.15.0 || ^26.0.0.
# ---------------------------------------------------------------------------

[frontend.packages]
angular_core = { package = "@angular/core", version = "22.3.0" }
angular_material = { package = "@angular/material", version = "22.3.0" }
angular_cli = { package = "@angular/cli", version = "22.3.0" }
typescript = { package = "typescript", version = "6.0.3" }
rxjs = { package = "rxjs", version = "7.8.2" }
zone_js = { package = "zone.js", version = "0.16.3" }
angular_eslint = { package = "angular-eslint", version = "22.8.0" }
playwright = { package = "@playwright/test", version = "1.65.1" }
openapi_generator_cli = { package = "@openapitools/openapi-generator-cli", version = "2.42.2" }

# ---------------------------------------------------------------------------
# Documentação e ferramentas de repositório
# ---------------------------------------------------------------------------

[docs.packages]
docusaurus_core = { package = "@docusaurus/core", version = "3.10.2" }
docusaurus_preset_classic = { package = "@docusaurus/preset-classic", version = "3.10.2" }
docusaurus_theme_mermaid = { package = "@docusaurus/theme-mermaid", version = "3.10.2" }
react = { package = "react", version = "19.3.1" }
react_dom = { package = "react-dom", version = "19.3.1" }
mdx_react = { package = "@mdx-js/react", version = "3.1.1" }
prism_react_renderer = { package = "prism-react-renderer", version = "2.4.1" }
clsx = { package = "clsx", version = "2.1.1" }
