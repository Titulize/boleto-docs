# Fonte única de verdade das versões da plataforma de boletos.
#
# Regras (validadas por scripts/validate-versions.mjs):
#  - Toda versão é exata. Sem faixas (^, ~, >, *), sem "latest", sem "+".
#  - Toda imagem Docker tem tag e digest sha256.
#  - Todo download tem URL e sha256.
#  - Os outros repositórios fixam uma TAG deste repositório (vX.Y.Z), nunca a main.
#
# Formato próprio (não é um catálogo do Gradle). Os arquivos derivados
# (libs.versions.toml, build args do Docker, pins do frontend) são gerados pela sincronização.
#
# Pesquisado em 2026-11-21. Fontes: endoflife.date, Maven Central, npm, GitHub Releases, registries de imagem. google-java-format conferido no Maven Central em 2026-11-21 (maven-metadata.xml).

schema_version = 1

[runtime.java]
# Amazon Corretto 25 (LTS, suporte até 2032-10). Imagens Docker em [images.corretto_*].
# corretto_build é o identificador usado pelo mise (corretto-<build>).
major = "25"
version = "25.0.5"
corretto_build = "25.0.5.1.2"

