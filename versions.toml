# ---------------------------------------------------------------------------
# Backend. Bibliotecas gerenciadas pelo BOM do Spring Boot (Hibernate 7.4.15,
# Spring Security 7.1.3, Testcontainers 2.0.5, Lettuce 7.5.2, driver PostgreSQL 42.7.14)
# não são repetidas aqui: seguem a versão do Spring Boot.
# ---------------------------------------------------------------------------

[backend.plugins]
spring_boot = { id = "org.springframework.boot", version = "4.1.3" }
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }

[backend.libs]
spring_modulith_bom = { module = "org.springframework.modulith:spring-modulith-bom", version = "2.1.3" }
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "3.2.0" }
