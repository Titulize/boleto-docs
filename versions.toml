# flyway-commandline, o núcleo, os verbos usados (info, migrate, validate, schemas, repair,
# baseline), o suporte ao PostgreSQL (com o driver) e as dependências de execução.
# Pesquisado em 2026-11-21 com mvn dependency:copy-dependencies e conferido no Maven Central (sha1/sha256).
