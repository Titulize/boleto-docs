archunit = { module = "com.tngtech.archunit:archunit-junit5", version = "1.5.1" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.87" }

[backend.tools]
jacoco = { version = "0.8.16" }
# Formatador do Spotless. 2.0.0 é a última release no Maven Central (2026-10-30) e lê Java 25.
google_java_format = { version = "2.0.0" }

# ---------------------------------------------------------------------------
# Frontend. Angular 22 exige TypeScript >=6.0 <6.1 e Node ^22.22.3 || ^24.15.0 || ^26.0.0.
